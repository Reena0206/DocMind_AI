<main class="flex-1 flex flex-col h-full min-w-0 bg-night-50 relative overflow-hidden">
  <!-- subtle grid -->
  <div class="absolute inset-0 grid-bg opacity-100 pointer-events-none z-0"></div>
  <!-- top fade gradient -->
  <div class="absolute top-0 inset-x-0 h-24 bg-gradient-to-b from-night-50 to-transparent pointer-events-none z-10"></div>

  <!-- topbar -->
  <header class="relative z-20 flex-shrink-0 h-[62px] flex items-center justify-between px-8 border-b border-white/[0.06] bg-night-50/80 backdrop-blur-xl">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-xl bg-night-200/60 border border-white/[0.06] flex items-center justify-center text-slate-400 hover:text-slate-200 transition-all mr-1 flex-shrink-0" title="Toggle Sidebar">
        <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
      <div class="w-8 h-8 rounded-xl bg-iris/10 border border-iris/20 flex items-center justify-center">
        <svg class="w-4 h-4 text-iris-light fill-none stroke-current stroke-[1.8]" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div>
        <h1 class="font-display text-[15px] font-bold text-slate-100">Document Chat</h1>
        <p class="text-[10px] text-slate-600 -mt-0.5">AI-powered document Q&A</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 px-3 py-1.5 bg-night-200/60 border border-white/[0.06] rounded-full">
        <div id="hdr-status-dot" class="w-1.5 h-1.5 rounded-full bg-rose transition-all"></div>
        <span id="hdr-status-text" class="text-[11px] text-slate-500 font-medium">Offline</span>
      </div>
    </div>
  </header>

  <!-- Message feed; select-text is re-enabled here because the page body is otherwise non-selectable -->
  <div id="messages-area" class="relative z-10 flex-1 overflow-y-auto px-[9%] pt-8 pb-6 flex flex-col gap-5 select-text">
    <div id="info-msg" class="flex-1 flex flex-col items-center justify-center text-center gap-4 py-16 msg-in">
      <!-- hero icon -->
      <div class="relative">
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-iris/20 to-sky/10 border border-iris/20 flex items-center justify-center">
          <svg class="w-9 h-9 text-iris-light fill-none stroke-current stroke-[1.5]" viewBox="0 0 24 24">
            <path d="M9.5 2a4 4 0 0 1 4 3.5A4 4 0 0 1 17 9c.83 0 1.5.67 1.5 1.5S17.83 12 17 12a4 4 0 0 1-3.5 3.5V17a2.5 2.5 0 0 1-5 0v-1.5A4 4 0 0 1 5 12c-.83 0-1.5-.67-1.5-1.5S4.17 9 5 9a4 4 0 0 1 3.5-3.5A4 4 0 0 1 9.5 2z"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-jade flex items-center justify-center shadow-lg">
          <svg class="w-3 h-3 text-white fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
      <div>
        <h2 class="font-display text-2xl font-bold g-text mb-2">Ready to explore your documents</h2>
        <p class="text-sm text-slate-500 max-w-[360px] leading-relaxed">Upload files from the sidebar, select them, and ask anything. DocMind will find the answers with source citations.</p>
      </div>
      <!-- feature pills -->
      <div class="flex flex-wrap gap-2 justify-center mt-1">
        <div class="flex items-center gap-1.5 text-[11.5px] text-slate-500 bg-night-100/80 border border-white/[0.07] px-3.5 py-1.5 rounded-full">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2 text-iris-light" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF &amp; Word
        </div>
        <div class="flex items-center gap-1.5 text-[11.5px] text-slate-500 bg-night-100/80 border border-white/[0.07] px-3.5 py-1.5 rounded-full">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2 text-sky" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Images &amp; OCR
        </div>
        <div class="flex items-center gap-1.5 text-[11.5px] text-slate-500 bg-night-100/80 border border-white/[0.07] px-3.5 py-1.5 rounded-full">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2 text-jade" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Source Citations
        </div>
        <div class="flex items-center gap-1.5 text-[11.5px] text-slate-500 bg-night-100/80 border border-white/[0.07] px-3.5 py-1.5 rounded-full">
          <svg class="w-3 h-3 fill-none stroke-current stroke-2 text-honey" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Chat History
        </div>
      </div>
    </div>
  </div>

  <!-- Composer stays pinned to the bottom while the feed scrolls above it -->
  <div class="relative z-20 flex-shrink-0 px-[9%] pb-7 pt-3 bg-gradient-to-t from-night-50 via-night-50/90 to-transparent">
    <form id="chat-form" onsubmit="sendMessage(event)">
      <div class="input-glow flex items-end gap-3 bg-night-100/90 backdrop-blur border border-white/8 rounded-2xl px-5 py-3 transition-all">
        <input id="chat-input" type="text" disabled placeholder="Ask anything about your documents..." autocomplete="off"
          class="flex-1 bg-transparent border-none outline-none text-sm text-slate-100 placeholder-slate-600 py-1.5 disabled:cursor-not-allowed"/>
        <button id="send-btn" type="submit" disabled
          class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-xl btn-iris text-white transition-all hover:scale-105 active:scale-100 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100">
          <svg id="send-icon" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
        </button>
      </div>
      <p class="text-[11px] text-slate-700 text-center mt-2">Select files from the sidebar to enable chat</p>
    </form>
  </div>
</main>
