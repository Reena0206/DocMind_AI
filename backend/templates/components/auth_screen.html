<!-- ══════════════════════════ AUTH SCREEN ══════════════════════════ -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-night-50 overflow-hidden">
  <!-- background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="anim-in relative z-10 w-[440px]">
    <!-- card -->
    <div class="bg-night-100/90 backdrop-blur-2xl border border-white/8 rounded-2xl p-10 shadow-xl2">
      <!-- logo -->
      <div class="flex flex-col items-center gap-3 mb-8">
        <div class="w-12 h-12 rounded-2xl btn-iris flex items-center justify-center shadow-iris">
          <!-- brain icon -->
          <svg class="w-6 h-6 text-white fill-none stroke-current stroke-[1.8]" viewBox="0 0 24 24">
            <path d="M9.5 2a4 4 0 0 1 4 3.5A4 4 0 0 1 17 9c.83 0 1.5.67 1.5 1.5S17.83 12 17 12a4 4 0 0 1-3.5 3.5V17a2.5 2.5 0 0 1-5 0v-1.5A4 4 0 0 1 5 12c-.83 0-1.5-.67-1.5-1.5S4.17 9 5 9a4 4 0 0 1 3.5-3.5A4 4 0 0 1 9.5 2z"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <div>
          <h1 class="font-display font-black text-2xl tracking-tight g-text text-center">DocMind AI</h1>
          <p class="text-xs text-slate-500 text-center mt-0.5">Document Intelligence Platform</p>
        </div>
      </div>

      <div class="mb-2">
        <h2 id="auth-title" class="font-display text-xl font-bold text-slate-100 text-center">Welcome back</h2>
        <p id="auth-subtitle" class="text-sm text-slate-500 text-center mt-1">Sign in to continue to your workspace</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="mt-6 space-y-4">
        <div class="space-y-1.5">
          <label class="text-[10.5px] font-bold uppercase tracking-[0.9px] text-slate-500" for="auth-username">Username</label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input id="auth-username" type="text" placeholder="your_username" autocomplete="username" required
              class="w-full bg-night-200/60 border border-white/8 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all focus:border-iris focus:shadow-iris"/>
          </div>
        </div>
        <div class="space-y-1.5">
          <label class="text-[10.5px] font-bold uppercase tracking-[0.9px] text-slate-500" for="auth-password">Password</label>
          <div class="relative">
            <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" required
              class="w-full bg-night-200/60 border border-white/8 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition-all focus:border-iris focus:shadow-iris"/>
          </div>
        </div>
        <div id="auth-err" class="text-xs text-center min-h-[18px] text-rose"></div>
        <button id="auth-submit-btn" type="submit"
          class="w-full py-3 rounded-xl text-sm font-bold font-display text-white btn-iris transition-all hover:-translate-y-0.5 active:translate-y-0 mt-2">
          Sign In
        </button>
      </form>

      <div class="mt-5 flex items-center gap-3">
        <div class="flex-1 h-px bg-white/6"></div>
        <span class="text-[11px] text-slate-600">or</span>
        <div class="flex-1 h-px bg-white/6"></div>
      </div>
      <p class="text-center text-sm text-slate-500 mt-4">
        <span id="auth-toggle-text">Don't have an account?</span>
        <span id="auth-toggle-link" onclick="toggleAuthMode()"
          class="ml-1.5 text-iris-light font-semibold cursor-pointer hover:text-iris transition-colors">Register</span>
      </p>
    </div>
    <p class="text-center text-[11px] text-slate-700 mt-4">Secure · Private · Local AI</p>
  </div>
</div>
