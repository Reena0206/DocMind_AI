<!-- ── SIDEBAR ──────────────────────────────────────────────────── -->
<aside id="sidebar" class="w-72 flex-shrink-0 h-full flex flex-col bg-night-100 border-r border-white/[0.06] overflow-hidden">

  <!-- brand header -->
  <div class="px-5 pt-5 pb-4 border-b border-white/[0.06] flex-shrink-0">
    <div class="flex items-center gap-2.5 mb-3.5">
      <div class="w-8 h-8 rounded-xl btn-iris flex items-center justify-center flex-shrink-0">
        <svg class="w-4 h-4 text-white fill-none stroke-current stroke-2" viewBox="0 0 24 24">
          <path d="M9.5 2a4 4 0 0 1 4 3.5A4 4 0 0 1 17 9c.83 0 1.5.67 1.5 1.5S17.83 12 17 12a4 4 0 0 1-3.5 3.5V17a2.5 2.5 0 0 1-5 0v-1.5A4 4 0 0 1 5 12c-.83 0-1.5-.67-1.5-1.5S4.17 9 5 9a4 4 0 0 1 3.5-3.5A4 4 0 0 1 9.5 2z"/>
        </svg>
      </div>
      <div>
        <span class="font-display font-black text-[15px] tracking-tight g-text">DocMind AI</span>
        <p class="text-[9.5px] text-slate-600 -mt-0.5">Intelligence Platform</p>
      </div>
    </div>

    <!-- status pill -->
    <div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-night-200/60 border border-white/[0.06]">
      <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-rose flex-shrink-0 transition-all"></div>
      <span id="status-text" class="text-[11px] text-slate-500 font-medium flex-1">Connecting…</span>
      <div id="model-badge" class="text-[10px] font-semibold text-iris-light bg-iris/10 px-2 py-0.5 rounded-full">—</div>
    </div>
  </div>

  <!-- user row -->
  <div class="mx-4 mt-3 flex items-center gap-2.5 px-3 py-2.5 bg-night-200/40 border border-white/[0.06] rounded-xl flex-shrink-0">
    <div id="user-avatar-letter" class="w-8 h-8 rounded-lg btn-iris flex items-center justify-center text-xs font-black text-white flex-shrink-0">U</div>
    <div class="flex-1 min-w-0">
      <p id="profile-username" class="text-[13px] font-semibold text-slate-200 truncate">Loading…</p>
      <p class="text-[10px] text-slate-600">Personal workspace</p>
    </div>
    <button onclick="logout()" title="Sign out"
      class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-600 hover:text-rose hover:bg-rose/10 transition-all flex-shrink-0">
      <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- scrollable body -->
  <div class="flex-1 overflow-y-auto px-4 pb-5 space-y-5 mt-4">

    <!-- conversations -->
    <div>
      <button onclick="startNewChat()"
        class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-[13px] font-bold font-display text-white btn-iris transition-all hover:-translate-y-0.5 active:translate-y-0 mb-3">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-[2.5]" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Conversation
      </button>

      <div class="flex items-center justify-between mb-2">
        <span class="text-[9.5px] font-black uppercase tracking-[1px] text-slate-600">Recent</span>
        <svg class="w-3 h-3 text-slate-700 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div id="conv-list" class="flex flex-col gap-1 max-h-[180px] overflow-y-auto">
        <p class="text-[11.5px] text-slate-600 text-center py-3">No conversations yet</p>
      </div>
    </div>

    <div class="h-px bg-white/[0.05]"></div>

    <!-- upload -->
    <div>
      <div class="flex items-center gap-1.5 mb-2.5">
        <svg class="w-3 h-3 text-slate-600 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="text-[9.5px] font-black uppercase tracking-[1px] text-slate-600">Upload Documents</span>
      </div>
      <div id="upload-zone" onclick="document.getElementById('file-input').click()"
        class="group border-2 border-dashed border-white/8 rounded-xl p-4 text-center cursor-pointer transition-all hover:border-iris/50 hover:bg-iris/[0.04]">
        <div class="w-9 h-9 rounded-xl bg-night-200/80 border border-white/8 flex items-center justify-center mx-auto mb-2.5 group-hover:border-iris/30 transition-all">
          <svg class="w-4.5 h-4.5 text-slate-500 group-hover:text-iris-light fill-none stroke-current stroke-[1.8] transition-colors" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="text-[12px] font-semibold text-slate-400 group-hover:text-iris-light transition-colors mb-0.5">Drop or click to upload</p>
        <p class="text-[10.5px] text-slate-600">PDF · DOCX · TXT · PNG · JPG</p>
        <input type="file" id="file-input" class="hidden" accept=".pdf,.docx,.doc,.txt,.png,.jpg,.jpeg" multiple/>
      </div>
      <!-- progress -->
      <div id="progress-box" class="hidden mt-2.5 items-center gap-2 bg-honey/[0.08] border border-honey/20 rounded-lg px-3 py-2.5 text-xs text-honey">
        <div class="w-3 h-3 border-2 border-honey/30 border-t-honey rounded-full animate-spin flex-shrink-0"></div>
        <span id="progress-msg">Processing…</span>
      </div>
    </div>

    <div class="h-px bg-white/[0.05]"></div>

    <!-- doc list -->
    <div>
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-1.5">
          <svg class="w-3 h-3 text-slate-600 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="text-[9.5px] font-black uppercase tracking-[1px] text-slate-600">Files for Chat</span>
        </div>
        <span id="stats-count" class="text-[10px] font-bold text-iris-light bg-iris/10 px-2 py-0.5 rounded-full">0 chunks</span>
      </div>
      <div id="doc-list" class="flex flex-col gap-1.5 max-h-[150px] overflow-y-auto">
        <p class="text-[11.5px] text-slate-600">No files uploaded yet.</p>
      </div>
    </div>

    <div class="h-px bg-white/[0.05]"></div>

    <!-- memory -->
    <div>
      <div class="flex items-center gap-1.5 mb-2.5">
        <svg class="w-3 h-3 text-slate-600 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        <span class="text-[9.5px] font-black uppercase tracking-[1px] text-slate-600">Session Memory</span>
      </div>
      <button onclick="clearMemory()"
        class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-[12px] font-semibold text-rose bg-rose/8 border border-rose/15 hover:bg-rose/14 transition-all">
        <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Clear Memory
      </button>
    </div>

  </div>
</aside>
